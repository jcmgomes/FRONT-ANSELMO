<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conecta Escola</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="loginView" class="login-wrap"><div class="login-card"><div class="brand-mark">CE</div><p class="eyebrow">GESTÃO DIGITAL ESCOLAR</p><h1>Conecta Escola</h1><p class="muted">Acesso aos recursos digitais e serviços de tecnologia.</p><form id="loginForm"><label>E-mail<input name="email" type="email" placeholder="seuemail@escola.com" required></label><label>Senha<input name="password" type="password" placeholder="Sua senha" required></label><button class="primary full">Entrar no sistema</button></form><button class="link-button" id="recoverBtn">Esqueci minha senha</button><p id="loginMessage" class="message"></p><div class="demo-hint"><b>Acesso inicial para demonstração</b><br>admin@conectaescola.com<br>Senha: Admin@123</div></div></div>
<div id="appView" class="app hidden"><aside class="sidebar"><div class="side-brand"><span class="brand-mark small">CE</span><div><b>Conecta Escola</b><small>PAINEL DIGITAL</small></div></div><div class="profile"><div class="avatar" id="avatar">A</div><div><b id="sideName">Usuário</b><small id="sideRole">Funcionário</small></div></div><nav id="navigation"><button class="nav-item active" data-page="dashboard">▦ <span>Visão geral</span></button><button class="nav-item" data-page="tickets">◷ <span>Solicitações</span></button><button class="nav-item" data-page="equipment">▣ <span>Equipamentos</span></button><button class="nav-item" data-page="wifi">⌁ <span>Wi-Fi e orientações</span></button><button class="nav-item" data-page="notices">▤ <span>Comunicados</span></button><button class="nav-item admin-only" data-page="users">♙ <span>Usuários</span></button><button class="nav-item admin-only" data-page="logs">☷ <span>Histórico</span></button></nav><button id="logoutBtn" class="logout">↪ Sair do sistema</button></aside>
<main class="main"><header class="topbar"><div><span class="eyebrow">AMBIENTE INSTITUCIONAL</span><h2 id="pageTitle">Visão geral</h2></div><div class="top-user"><span class="status-dot"></span><span id="topName">Usuário</span></div></header><div id="content" class="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Cadastro</h3><button id="closeModal" class="icon-btn">×</button></div><form id="modalForm"><div id="modalFields"></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancelar</button><button class="primary">Salvar</button></div></form></div></div><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
